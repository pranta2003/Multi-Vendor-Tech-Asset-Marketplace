# ==============================================================================
# nginx config for the SPA + API reverse proxy.
#
# THE ARCHITECTURAL POINT OF THIS FILE:
# the SPA and the API are served from ONE origin. The refresh token lives in an
# HttpOnly cookie scoped to Path=/api/v1/auth with SameSite=Lax. If the browser
# talked to the API on a different origin (say :5000 while the app is on :80),
# that cookie would be cross-site and would require SameSite=None; Secure -
# which is a strictly weaker CSRF posture and breaks entirely over plain HTTP.
#
# Same-origin in production mirrors the Vite dev proxy in development, so the
# identical cookie attributes work in both. That symmetry is why there are no
# environment-specific auth branches in the client code.
# ==============================================================================

upstream api_upstream {
    # `api` is the compose service name, resolved by Docker's embedded DNS.
    server api:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Hardening -----------------------------------------------------------
    # Helmet sets these on API responses, but static assets are served by nginx
    # and never pass through Express, so they must be set again here.
    server_tokens off;                       # do not advertise the nginx version

    # CRITICAL nginx GOTCHA, verified by testing this config rather than reading
    # it: add_header does NOT accumulate across levels. If a `location` block
    # contains ANY add_header of its own, every add_header inherited from
    # `server` is DISCARDED - silently, with no warning.
    #
    # Both locations below set their own Cache-Control, so declaring these three
    # headers only at server level meant the actual HTML response carried none of
    # them. They are therefore included per-location via this snippet. `include`
    # is used instead of copy-paste so the two locations cannot drift apart.
    include /etc/nginx/snippets/security-headers.conf;

    # Uploads are not part of this API's surface; a low cap blunts trivial
    # request-body DoS. Raise this deliberately if file upload is ever added.
    client_max_body_size 1m;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;                            # correct caching for both encodings
    gzip_min_length 1024;                    # tiny payloads get larger when gzipped
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # --- API reverse proxy ---------------------------------------------------
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;              # required for upstream keepalive

        # WHY these headers: Express sits behind a proxy, so without them every
        # request appears to originate from the nginx container's IP. That would
        # make express-rate-limit bucket the ENTIRE INTERNET into one counter -
        # one abusive client could lock out all users. The app sets `trust proxy`
        # so req.ip resolves to X-Forwarded-For instead.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Stripe and SSLCommerz webhooks are server-to-server and can be slower
        # than a user-facing request, but an unbounded timeout would let dead
        # upstreams pile up worker connections.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Never cache API responses - they are per-user and auth-dependent.
        proxy_buffering off;
    }

    # --- Static assets -------------------------------------------------------
    # Vite emits content-hashed filenames (app.4f2b1c.js), so the contents at a
    # given URL can never change. That makes a one-year immutable cache safe and
    # means repeat visits re-download nothing.
    location /assets/ {
        # A single Cache-Control header, not `expires 1y` PLUS an add_header:
        # using both emits TWO Cache-Control headers (max-age=31536000 and
        # public, immutable) which is ambiguous for caches. `immutable` already
        # implies the resource will never be revalidated.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA history fallback ------------------------------------------------
    # React Router owns client-side routes like /orders/abc123. Those paths do
    # not exist on disk, so a hard refresh or a shared link would 404 without
    # this. Serving index.html lets the router resolve the URL in the browser.
    location / {
        # index.html itself must NEVER be cached: it is the document that
        # references the hashed bundles. A stale copy would keep pointing at
        # assets that were deleted by the last deploy - the classic "white screen
        # after deploy" bug.
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
