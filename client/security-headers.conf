# Shared security headers, included by every `location` block in nginx.conf.
#
# WHY this is a separate file rather than three lines in the server block:
# nginx's add_header does NOT inherit into a location that declares any
# add_header of its own - the inherited set is replaced, silently. Since both
# locations set their own Cache-Control, these headers must be repeated inside
# each one. Keeping them in one included file means the copies cannot drift.
#
# `always` makes them apply to error responses (404, 502) too, not just 2xx.

# Prevents the browser from MIME-sniffing a response away from its declared
# Content-Type - the vector that turns an uploaded "image" into executed script.
add_header X-Content-Type-Options "nosniff" always;

# Blocks framing entirely. This app has no legitimate embedding use case, so DENY
# is the correct choice over SAMEORIGIN; it removes clickjacking as a category.
add_header X-Frame-Options "DENY" always;

# Sends the full referrer only on same-origin navigation, and just the origin
# cross-origin. Stops paths like /orders/<uuid> leaking into third-party logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
